<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F5FA" />
    <meta name="description" content="Prospect’Immo — prospection, relances et fidélisation" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prospect’Immo" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Prospect’Immo</title>
    <script>
      // Applique le thème avant l'affichage pour éviter un flash blanc.
      try {
        var t = localStorage.getItem('linkimmo.theme')
        var dark = t === 'sombre' || (t !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var p = localStorage.getItem('linkimmo.palette')
        document.documentElement.dataset.palette = p === 'lagon' || p === 'corail' ? p : 'indigo'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
